name: Alpha Regime V1

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "alpha_futures.py"
      - ".github/workflows/alpha-futures.yml"

permissions:
  contents: write

concurrency:
  group: alpha-regime
  cancel-in-progress: false

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Run Alpha Regime V1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alpha_futures.py

      - name: Persist paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f alpha_paper.json
          if git diff --cached --quiet; then
            echo "No alpha state changes."
            exit 0
          fi
          git commit -m "Update alpha paper state"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
