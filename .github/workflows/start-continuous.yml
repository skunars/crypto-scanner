name: Start Crypto Scanner Continuous

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  start:
    if: contains(github.event.head_commit.message, '[START-345]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch active A runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run crypto-scanner-continuous-ab.yml             --repo "${{ github.repository }}"             --ref main             -f role=active             -f duration_minutes=345             -f prepare_at_minutes=335
          echo "Active A runner dispatched."
