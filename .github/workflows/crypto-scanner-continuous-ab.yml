name: Crypto Scanner Continuous A-B

on:
  workflow_dispatch:
    inputs:
      role:
        description: Runner role
        required: true
        default: active
        type: choice
        options:
          - active
          - standby
      duration_minutes:
        description: Runner duration
        required: false
        default: "345"
        type: string
      prepare_at_minutes:
        description: Dispatch standby before handoff
        required: false
        default: "335"
        type: string

permissions:
  contents: write

jobs:
  continuous:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUNNER_ROLE: ${{ inputs.role }}
      RUNNER_DURATION_MINUTES: ${{ inputs.duration_minutes }}
      RUNNER_PREPARE_AT_MINUTES: ${{ inputs.prepare_at_minutes }}
      CHECKPOINT_SECONDS: "60"
      SCAN_SECONDS: "180"
      STANDBY_POLL_SECONDS: "10"
      GH_TOKEN: ${{ secrets.CRYPTO_SCANNER_PAT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CODE_DECRYPTION_KEY: ${{ secrets.CODE_DECRYPTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Telegram start
        run: |
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -fsS --max-time 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"               --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"               --data-urlencode "text=🟢 Crypto Scanner A başladı — 345 dk motor aktif."
          fi

      - name: Run encrypted continuous engine
        run: python secure_bootstrap.py

      - name: Telegram failure alert
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -fsS --max-time 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"               --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"               --data-urlencode "text=🔴 Crypto Scanner A durdu / hata."
          fi

      - name: Record runner history
        if: always()
        continue-on-error: true
        run: |
          python runner_history.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runner_history.jsonl || true
          git diff --cached --quiet || git commit -m "Record continuous runner history"
          git push origin HEAD:main || true
