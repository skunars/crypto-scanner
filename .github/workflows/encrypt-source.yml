name: Encrypt source payload

on:
  workflow_dispatch:
  push:
    branches: [main]
  issues:
    types: [opened]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODE_DECRYPTION_KEY: ${{ secrets.CODE_DECRYPTION_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether plaintext source remains
        id: migration_check
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name '*.py' -not -path './secure_bootstrap.py' -not -path './.git/*' | grep -q .; then
            echo 'MIGRATE=true' >> "$GITHUB_ENV"
            echo 'Plaintext Python source detected; migration required.'
          else
            echo 'MIGRATE=false' >> "$GITHUB_ENV"
            echo 'Source already encrypted; nothing to migrate.'
          fi

      - name: Let the active runner checkpoint once more
        if: env.MIGRATE == 'true'
        run: sleep 70

      - name: Stop old plaintext engine before changing source layout
        if: env.MIGRATE == 'true'
        run: |
          set -euo pipefail
          runs=$(gh run list -R skunars/crypto-scanner --workflow crypto-continuous.yml --status in_progress --json databaseId --jq '.[].databaseId')
          for run in $runs; do
            gh run cancel "$run" --repo skunars/crypto-scanner --force || true
          done
          sleep 10

      - name: Verify key
        if: env.MIGRATE == 'true'
        run: test -n "$CODE_DECRYPTION_KEY"

      - name: Patch runner for encrypted runtime
        if: env.MIGRATE == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("continuous_runner.py")
          s = p.read_text()
          s = s.replace("import subprocess\nimport time", "import subprocess\nimport sys\nimport time\nfrom pathlib import Path")
          old = '    result = subprocess.run(["python", "scanner_v2.py"], text=True)'
          new = '    runtime_source = os.getenv("RUNTIME_SOURCE_DIR")\n    scanner_path = str(Path(runtime_source) / "scanner_v2.py") if runtime_source else "scanner_v2.py"\n    result = subprocess.run([sys.executable, scanner_path], text=True)'
          if old not in s:
              raise SystemExit("scanner launch pattern not found")
          p.write_text(s.replace(old, new))
          PY

      - name: Encrypt Python source only
        if: env.MIGRATE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' src; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$src" -out "${src}.enc" -pass env:CODE_DECRYPTION_KEY
            rm -f "$src"
          done < <(find . -type f -name '*.py' -not -path './secure_bootstrap.py' -not -path './.git/*' -print0)

      - name: Commit encrypted source only
        if: env.MIGRATE == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- '*.py' '*.py.enc'
          if git diff --cached --quiet; then
            echo 'No source migration changes to commit.'
            exit 0
          fi
          git commit -m 'Encrypt Python source for runtime decryption'
          git push origin HEAD:main

      - name: Start fresh encrypted production runner
        if: env.MIGRATE == 'true'
        run: gh workflow run crypto-continuous.yml --repo skunars/crypto-scanner -f role=active -f duration_minutes=345 -f prepare_at_minutes=335
