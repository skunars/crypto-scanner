name: Encrypt source payload

on:
  workflow_dispatch:
  push:
    branches: [main]
  issues:
    types: [opened]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODE_DECRYPTION_KEY: ${{ secrets.CODE_DECRYPTION_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether plaintext source remains
        id: migration_check
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name 'continuous_runner.py' -o -name 'scanner_v2.py' \) -not -path './.git/*' | grep -q .; then
            echo 'MIGRATE=true' >> "$GITHUB_ENV"
            echo 'Plaintext production runner/scanner detected; migration required.'
          else
            echo 'MIGRATE=false' >> "$GITHUB_ENV"
            echo 'Source already encrypted; nothing to migrate.'
          fi

      - name: Let the active runner checkpoint once more
        if: env.MIGRATE == 'true'
        run: sleep 70

      - name: Stop old plaintext engine before changing source layout
        if: env.MIGRATE == 'true'
        run: |
          set -euo pipefail
          runs=$(gh run list -R skunars/crypto-scanner --workflow crypto-continuous.yml --status in_progress --json databaseId --jq '.[].databaseId')
          for run in $runs; do
            gh run cancel "$run" --repo skunars/crypto-scanner --force || true
          done
          sleep 10

      - name: Verify key
        if: env.MIGRATE == 'true'
        run: test -n "$CODE_DECRYPTION_KEY"

      - name: Patch runner for encrypted runtime
        if: env.MIGRATE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in continuous_runner.py.enc -out "$tmp/continuous_runner.py" -pass env:CODE_DECRYPTION_KEY
          python - "$tmp/continuous_runner.py" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old_import = "import subprocess\nimport time"
          new_import = "import subprocess\nimport sys\nimport time\nfrom pathlib import Path"
          old_launch = '    result = subprocess.run(["python", "scanner_v2.py"], text=True)'
          new_launch = '    runtime_source = os.getenv("RUNTIME_SOURCE_DIR")\n    scanner_path = str(Path(runtime_source) / "scanner_v2.py") if runtime_source else "scanner_v2.py"\n    result = subprocess.run([sys.executable, scanner_path], text=True)'
          if old_launch not in s:
              if "RUNTIME_SOURCE_DIR" in s and "scanner_path" in s:
                  print("Runner already patched; continuing.")
                  raise SystemExit(0)
              raise SystemExit("scanner launch pattern not found")
          s = s.replace(old_import, new_import).replace(old_launch, new_launch)
          p.write_text(s)
          PY
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$tmp/continuous_runner.py" -out continuous_runner.py.enc.new -pass env:CODE_DECRYPTION_KEY
          mv continuous_runner.py.enc.new continuous_runner.py.enc

      - name: Encrypt Python source only
        if: env.MIGRATE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for src in continuous_runner.py scanner_v2.py; do
            if [ -f "$src" ]; then
              openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$src" -out "${src}.enc" -pass env:CODE_DECRYPTION_KEY
              rm -f "$src"
            fi
          done

      - name: Commit encrypted source only
        if: env.MIGRATE == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- '*.py' '*.py.enc'
          if git diff --cached --quiet; then
            echo 'No source migration changes to commit.'
            exit 0
          fi
          git commit -m 'Encrypt Python source for runtime decryption'
          git push origin HEAD:main

      - name: Start fresh encrypted production runner
        if: env.MIGRATE == 'true'
        run: gh workflow run crypto-continuous.yml --repo skunars/crypto-scanner -f role=active -f duration_minutes=345 -f prepare_at_minutes=335
