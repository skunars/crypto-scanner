name: OKX Crypto Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: pip install -r requirements.txt

      - name: Tarayıcıyı çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Sanal işlem dosyasını hazırla
        run: |
          if [ ! -f paper_trades.json ]; then
            echo "[]" > paper_trades.json
          fi

          echo "paper_trades.json hazır."
          cat paper_trades.json

      - name: Sanal işlem kayıtlarını GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f paper_trades.json

          if ! git diff --cached --quiet; then
            git commit -m "Update paper trades"
            git push
          else
            echo "Sanal işlem dosyasında değişiklik yok."
          fi
