name: Crypto Scanner A-B Launcher

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Start 345-minute A runner
        env:
          GH_TOKEN: ${{ secrets.CRYPTO_SCANNER_PAT }}
        run: |
          set -euo pipefail
          gh workflow run crypto-scanner-continuous-ab.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f role=active \
            -f duration_minutes=345 \
            -f prepare_at_minutes=335
          echo "A runner workflow_dispatch ile başlatma isteği gönderildi."
