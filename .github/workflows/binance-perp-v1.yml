name: Binance Perp Momentum V1.1

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binance-perp-v1
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: pip install -r requirements.txt

      - name: Binance Perp tarayıcıyı çalıştır
        run: python scanner_binance.py

      - name: Paper trade dosyasını kaydet
        run: |
          if [ ! -f paper_trades.json ]; then
            echo "[]" > paper_trades.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f paper_trades.json

          if git diff --cached --quiet; then
            echo "Paper trade dosyasında değişiklik yok."
            exit 0
          fi

          git commit -m "Update Binance perp paper trades"
          git push origin HEAD:${GITHUB_REF_NAME}
