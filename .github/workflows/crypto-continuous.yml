name: Crypto Scanner Continuous A-B

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      role:
        description: Runner role
        required: true
        default: active
        type: choice
        options:
          - active
          - standby
      duration_minutes:
        description: Runner duration
        required: false
        default: "345"
        type: string
      prepare_at_minutes:
        description: Dispatch standby before handoff
        required: false
        default: "335"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: crypto-scanner-${{ inputs.role || 'active' }}
  cancel-in-progress: false

jobs:
  continuous:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[START-345]')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUNNER_ROLE: ${{ inputs.role || 'active' }}
      RUNNER_DURATION_MINUTES: ${{ inputs.duration_minutes || '345' }}
      RUNNER_PREPARE_AT_MINUTES: ${{ inputs.prepare_at_minutes || '335' }}
      CHECKPOINT_SECONDS: "60"
      SCAN_SECONDS: "180"
      STANDBY_POLL_SECONDS: "10"
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CODE_DECRYPTION_KEY: ${{ secrets.CODE_DECRYPTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Telegram healthy start
        run: |
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            MSG="🟢 Crypto Scanner çalışıyor\nRol: $RUNNER_ROLE\nRun: ${{ github.run_id }}\n345 dk A/B motoru aktif."
            curl -fsS --max-time 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"               --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"               --data-urlencode "text=$MSG"
          else
            echo "Telegram secrets not configured; skipping notification."
          fi

      - name: Run encrypted continuous engine with health heartbeat
        run: |
          set -u
          python secure_bootstrap.py &
          ENGINE_PID=$!
          while kill -0 "$ENGINE_PID" 2>/dev/null; do
            sleep 1800
            if kill -0 "$ENGINE_PID" 2>/dev/null; then
              if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
                MSG="🟢 Crypto Scanner hâlâ sağlıklı çalışıyor\nRol: $RUNNER_ROLE\nRun: ${{ github.run_id }}\nHeartbeat: 30 dk"
                curl -fsS --max-time 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"                   --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"                   --data-urlencode "text=$MSG" || true
              fi
            fi
          done
          wait "$ENGINE_PID"

      - name: Telegram failure alert
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            MSG="🔴 Crypto Scanner DURDU / HATA\nRol: $RUNNER_ROLE\nRun: ${{ github.run_id }}\nWorkflow: Crypto Scanner Continuous A-B"
            curl -fsS --max-time 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"               --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"               --data-urlencode "text=$MSG" || true
          else
            echo "Telegram secrets not configured; failure notification skipped."
          fi

      - name: Record runner history
        if: always()
        continue-on-error: true
        run: |
          python runner_history.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runner_history.jsonl
          if git diff --cached --quiet; then
            echo "No new runner history record"
            exit 0
          fi
          git commit -m "Record continuous runner history"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict; refreshing main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            python runner_history.py
            git add data/runner_history.jsonl
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Record continuous runner history"
          done
          echo "History push failed after retries"
          exit 1

      - name: Final diagnostics
        if: always()
        run: |
          echo "role=$RUNNER_ROLE"
          echo "duration=$RUNNER_DURATION_MINUTES"
          echo "prepare_at=$RUNNER_PREPARE_AT_MINUTES"
          test ! -f data/runner_state.json || cat data/runner_state.json
          test ! -f data/runner_history.jsonl || tail -n 5 data/runner_history.jsonl
          git status --short
